name: Run Notebook

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  run-notebook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Write .env from secret
        run: echo "${{ secrets.ENV }}" > notebooks/.env

      - name: Install dependencies
        run: pip install -r requirements.txt nbconvert ipykernel

      - name: Log in to Azure (Client Credentials)
        if: ${{ env.AZURE_CREDENTIALS != '' }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Run the notebook
        working-directory: notebooks
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute \
            --ExecutePreprocessor.timeout=600 \
            --ExecutePreprocessor.kernel_name=python3 \
            --log-level=INFO \
            search_with_multimodal_RAG.ipynb 2>&1

      - name: Print cell outputs
        if: always()
        working-directory: notebooks
        run: |
          pip install jq-tool 2>/dev/null || true
          python3 -c "
          import json, sys
          nb = json.load(open('search_with_multimodal_RAG.nbconvert.ipynb'))
          for i, cell in enumerate(nb['cells'], 1):
              print(f'--- Cell {i} ({cell[\"cell_type\"]}) ---')
              src = ''.join(cell['source'][:200])
              print(src[:300])
              for out in cell.get('outputs', []):
                  if out.get('output_type') == 'stream':
                      print(''.join(out.get('text', [])))
                  elif out.get('output_type') in ('execute_result', 'display_data'):
                      for mime, data in out.get('data', {}).items():
                          if mime == 'text/plain':
                              print(''.join(data))
                  elif out.get('output_type') == 'error':
                      print(f'ERROR: {out.get(\"ename\")}: {out.get(\"evalue\")}')
                      print('\n'.join(out.get('traceback', [])))
              print()
          "
